[package]
name = "myspace"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
console = "0.16.4"
directories = "6.0.0"
dirs = "6.0.0"
indicatif = "0.18.6"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "fs"] }
toml = { version = "1.1.4", features = ["parse", "display", "serde"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
