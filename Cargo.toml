[package]
name = "myspace"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
# The `ssh` feature is REQUIRED, not optional: git2 0.21 ships
# `default = []`, so without it libgit2 is built with no SSH transport and
# every git@host:… clone fails with "unsupported URL protocol; class=Net".
# (https is deliberately not enabled yet — SSH is the only supported
# transport; enabling it pulls in openssl-sys.)
git2 = { version = "0.21.0", features = ["ssh"] }
indicatif = "0.18.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = { version = "1.1.4", features = ["parse", "display", "serde"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
