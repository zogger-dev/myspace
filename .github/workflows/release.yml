name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - build: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - build: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - build: macos-intel
            os: macos-latest
            target: x86_64-apple-darwin
          - build: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install cross (for linux-arm64)
      if: matrix.build == 'linux-arm64'
      run: cargo install cross

    - name: Build
      if: matrix.build != 'linux-arm64'
      run: cargo build --release --target ${{ matrix.target }}

    - name: Build with cross
      if: matrix.build == 'linux-arm64'
      run: cross build --release --target ${{ matrix.target }}

    - name: Package Binary
      shell: bash
      run: |
        cd target/${{ matrix.target }}/release
        tar -czf myspace-${{ matrix.build }}.tar.gz myspace
        echo "ASSET_PATH=target/${{ matrix.target }}/release/myspace-${{ matrix.build }}.tar.gz" >> $GITHUB_ENV

    - name: Release
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ env.ASSET_PATH }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
